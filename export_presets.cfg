[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Video is a desktop-only luxury: Theora files dwarf the stills and the web
; build already ships a 38 MB engine. The browser uses procedural motion.
exclude_filter="shots/*,*.ogv,*.mp4,build/*,web/*"
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
; Threads need COOP/COEP response headers, which GitHub Pages cannot set.
; Turning them off costs nothing for a 2D puzzle game and makes the build
; hostable on any static file host.
variant/thread_support=false
vram_texture_compression/for_desktop=false
; ETC2/ASTC compression would need enabling in project settings and buys
; nothing here — the whole game is one photo plus flat-colour drawing.
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell="res://web/shell.html"
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
; The share screen has text fields, and without this a phone keyboard never
; opens for them.
html/experimental_virtual_keyboard=true
progressive_web_app/enabled=true
progressive_web_app/ensure_cross_origin_isolation_headers=false
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0.870588, 0.862745, 0.839216, 1)
